name: Build Hybrid Hermes Companion APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'companion/**'
      - '.github/workflows/build-companion-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: companion

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: companion/package-lock.json

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        run: ./android/gradlew --no-daemon --stacktrace assembleRelease

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk hybrid-hermes-companion.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-hermes-companion-apk
          path: companion/hybrid-hermes-companion.apk
          if-no-files-found: error
          retention-days: 30
